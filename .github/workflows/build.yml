name: Build y pruebas

# Compila el juego, corre la prueba de humo web y genera un APK de prueba.
# No publica ni despliega nada: los resultados quedan como artefactos del workflow.

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2
  GODOT_TOOLS_DIR: /home/runner/godot-tools

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            /home/runner/godot-tools
            /home/runner/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-v1
      - run: scripts/ci/setup-godot.sh "$GODOT_VERSION"
      - name: Exportar web
        working-directory: game
        run: |
          mkdir -p ../build/web
          "$GODOT_TOOLS_DIR/godot" --headless --import
          "$GODOT_TOOLS_DIR/godot" --headless --export-release "Web" ../build/web/index.html
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prueba de humo (teclado, control, táctil)
        working-directory: tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node web-smoke.mjs ../build/web ../test-results
        timeout-minutes: 6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-y-capturas
          path: |
            build/web
            test-results

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            /home/runner/godot-tools
            /home/runner/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-v1
      - run: scripts/ci/setup-godot.sh "$GODOT_VERSION"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Configurar SDK de Android y llave de depuración
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" -alias androiddebugkey \
            -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<TRES
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          TRES
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"
      - name: Exportar APK de prueba
        working-directory: game
        run: |
          mkdir -p ../build/android
          "$GODOT_TOOLS_DIR/godot" --headless --import
          "$GODOT_TOOLS_DIR/godot" --headless --export-debug "Android" ../build/android/eclipse-of-the-tilted.apk
          test -s ../build/android/eclipse-of-the-tilted.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk-de-prueba
          path: build/android/eclipse-of-the-tilted.apk
